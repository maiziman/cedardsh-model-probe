name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install the profile package manager
        run: npm install --global pnpm@11.7.0
      - name: Exercise the Windows one-click files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content ./package.json -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          $pack = npm pack --ignore-scripts --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($pack).Count -ne 1) {
            throw 'npm pack did not produce one package'
          }
          $asset = "CedarDSH-Model-Probe-v$version.tgz"
          Move-Item -LiteralPath ([string]@($pack)[0].filename) -Destination $asset
          ./test/windows-installers.e2e.ps1 -PackagePath $asset

  publish:
    needs: validate-windows-installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test and pack
        id: pack
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content ./package.json -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "tag $env:RELEASE_TAG does not match package version $version"
          }
          node --test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pack = npm pack --ignore-scripts --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($pack).Count -ne 1) {
            throw 'npm pack did not produce one package'
          }
          $source = [string]@($pack)[0].filename
          $asset = "CedarDSH-Model-Probe-v$version.tgz"
          Move-Item -LiteralPath $source -Destination $asset

          $windowsAsset = "CedarDSH-Model-Probe-Windows-v$version.zip"
          $windowsRoot = Join-Path $env:RUNNER_TEMP 'model-probe-windows'
          New-Item -ItemType Directory -Path $windowsRoot | Out-Null
          Copy-Item -LiteralPath $asset -Destination $windowsRoot
          Copy-Item -LiteralPath ./Install-Model-Probe.cmd -Destination $windowsRoot
          Copy-Item -LiteralPath ./Uninstall-Model-Probe.cmd -Destination $windowsRoot
          Copy-Item -LiteralPath ./README-Windows.txt -Destination (Join-Path $windowsRoot 'README.txt')
          Compress-Archive -Path (Join-Path $windowsRoot '*') -DestinationPath $windowsAsset

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $windowsAsset))
          try {
            $entries = @($archive.Entries | ForEach-Object FullName | Sort-Object)
          } finally {
            $archive.Dispose()
          }
          $expectedEntries = @(
            $asset
            'Install-Model-Probe.cmd'
            'README.txt'
            'Uninstall-Model-Probe.cmd'
          ) | Sort-Object
          if (@(Compare-Object $expectedEntries $entries).Count -ne 0) {
            throw "unexpected Windows ZIP entries: $($entries -join ', ')"
          }

          @($asset, $windowsAsset) | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $_"
          } | Set-Content -LiteralPath SHA256SUMS.txt -Encoding utf8NoBOM

          $installRoot = Join-Path $env:RUNNER_TEMP 'plugin-install'
          npm install --ignore-scripts --no-package-lock --no-save --prefix $installRoot "./$asset"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $installRoot
          try {
            node --input-type=module -e "const plugin = await import('@maiziman/dsh-model-capabilities'); if (plugin.name !== 'model-capabilities' || typeof plugin.apply !== 'function') process.exit(1)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          "asset=$asset" >> $env:GITHUB_OUTPUT
          "windows_asset=$windowsAsset" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.pack.outputs.asset }}
          WINDOWS_ASSET: ${{ steps.pack.outputs.windows_asset }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          $notes = @'
          Automatically detects reasoning levels and image input for custom OpenAI-compatible models in DeepSeek Harness.

          **One-click install in CedarDSH Desktop**
          1. Download `{{WINDOWS_ASSET}}` and put it beside `CedarDSH-Desktop.exe` and `dsh.cmd`.
          2. Choose **Extract All**, close CedarDSH Desktop, then double-click `Install-Model-Probe.cmd` in the extracted folder.
          3. Reopen CedarDSH Desktop. The same folder includes `Uninstall-Model-Probe.cmd` for one-click removal.

          The raw `{{ASSET}}` remains available for command-line installations.

          This release recognizes gateways that return a normal answer for an invalid reasoning level while returning reasoning only for supported `low`, `high`, or `max` levels.

          Verified with DeepSeek Harness `0.1.2-alpha.2` from official tag `dsh-v0.1.2-alpha.2`.
          '@
          $notes = $notes.Replace('{{ASSET}}', $env:ASSET)
          $notes = $notes.Replace('{{WINDOWS_ASSET}}', $env:WINDOWS_ASSET)
          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8NoBOM
          gh release create "v$env:VERSION" $env:ASSET $env:WINDOWS_ASSET SHA256SUMS.txt --verify-tag --title "CedarDSH Model Probe v$env:VERSION" --notes-file release-notes.md --latest
