name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test and pack
        id: pack
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content ./package.json -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "tag $env:RELEASE_TAG does not match package version $version"
          }
          node --test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pack = npm pack --ignore-scripts --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($pack).Count -ne 1) {
            throw 'npm pack did not produce one package'
          }
          $source = [string]@($pack)[0].filename
          $asset = "CedarDSH-Model-Probe-v$version.tgz"
          Move-Item -LiteralPath $source -Destination $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -LiteralPath SHA256SUMS.txt -Encoding utf8NoBOM

          $installRoot = Join-Path $env:RUNNER_TEMP 'plugin-install'
          npm install --ignore-scripts --no-package-lock --no-save --prefix $installRoot "./$asset"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $installRoot
          try {
            node --input-type=module -e "const plugin = await import('@maiziman/dsh-model-capabilities'); if (plugin.name !== 'model-capabilities' || typeof plugin.apply !== 'function') process.exit(1)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          "asset=$asset" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.pack.outputs.asset }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          $notes = @"
          Automatically detects reasoning levels and image input for custom OpenAI-compatible models in DeepSeek Harness.

          **Install in CedarDSH Desktop**
          1. Download `$env:ASSET` and put it beside `DeepSeek-Harness.exe` and `dsh.cmd`. Do not extract it.
          2. Close the app and run:

          `.\dsh.cmd plugin --profile web add ".\$env:ASSET" --offline`

          3. Reopen `DeepSeek-Harness.exe`. The plugin runs in the background; no extra configuration is required.

          Verified with DeepSeek Harness `0.1.2-alpha.2` from official tag `dsh-v0.1.2-alpha.2`.
          "@
          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8NoBOM
          gh release create "v$env:VERSION" $env:ASSET SHA256SUMS.txt --verify-tag --title "CedarDSH Model Probe v$env:VERSION" --notes-file release-notes.md --latest
